spring:
  application:
    name: discodeit
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 100
    open-in-view: false

  boot:
    admin:
      client:
        instance:
          name: discodeit

discodeit:
  repository:
    type: jpa
  storage:
    type: local
    local:
      root-path: .discodeit/storage

logging:
  level:
    root: info
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  info:
    env:
      enabled: true

info:
  app:
    name: Discodeit
    version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.4.0
  datasource:
    url: ${spring.datasource.url:N/A}
    driver-class-name: ${spring.datasource.driver-class-name:N/A}
  jpa:
    ddl-auto: ${spring.jpa.hibernate.ddl-auto:validate}
  storage:
    type: ${discodeit.storage.type:local}
    path: ${discodeit.storage.local.root-path:.discodeit/storage}
  multipart:
    max-file-size: ${spring.servlet.multipart.max-file-size:1MB}
    max-request-size: ${spring.servlet.multipart.max-request-size:10MB}
